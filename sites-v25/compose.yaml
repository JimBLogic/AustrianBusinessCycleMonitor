services:
  monitor:
    build:
      context: .
      target: local
    ports:
      - "${ABCM_SITES_PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:3000/api/health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
