apiVersion: apps/v1
kind: Deployment
metadata:
  name: abcm-dashboard
  labels:
    app: abcm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: abcm
      tier: web
  template:
    metadata:
      labels:
        app: abcm
        tier: web
    spec:
      containers:
        - name: dashboard
          image: YOUR_REAL_IMAGE # e.g. ghcr.io/your-org/abcm:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
              name: http
          env:
            - name: FRED_API_KEY
              valueFrom:
                secretKeyRef:
                  name: abcm-secrets
                  key: fred_api_key
            - name: LOG_LEVEL
              value: INFO
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      restartPolicy: Always
