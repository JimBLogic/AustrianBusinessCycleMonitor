name: abcm-sites-selfhost

services:
  monitor:
    build:
      context: .
      dockerfile: Dockerfile.selfhost
      args:
        ABCM_PUBLIC_ORIGIN: ${ABCM_PUBLIC_ORIGIN:-http://localhost}
    init: true
    restart: unless-stopped
    env_file:
      - .env.selfhost
    volumes:
      - abcm-worker-data:/data
    expose:
      - "8787"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-http://localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.selfhost:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      monitor:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  abcm-worker-data:
  caddy-data:
  caddy-config:
