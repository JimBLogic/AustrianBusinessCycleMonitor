name: Production data refresh and verification
on:
  schedule:
    - cron: '0 10,11 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: abcm-production-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate daily recovery policy
        run: node --test tests/daily-production.test.mjs
      - name: Refresh or verify Madrid edition, including delayed scheduled runs
        run: node scripts/production-daily.mjs
