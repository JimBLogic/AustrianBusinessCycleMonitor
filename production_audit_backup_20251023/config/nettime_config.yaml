# NetTime Configuration
# Simple Network Time Protocol (SNTP) Client Settings

# Default NTP servers (in order of preference)
ntp_servers:
  primary:
    - "pool.ntp.org"
    - "time.nist.gov" 
    - "time.google.com"
    - "time.cloudflare.com"
  
  backup:
    - "time.windows.com"
    - "0.pool.ntp.org"
    - "1.pool.ntp.org"
    - "2.pool.ntp.org"
    - "3.pool.ntp.org"
  
  specialized:
    - "tick.usno.navy.mil"  # US Naval Observatory
    - "tock.usno.navy.mil"  # US Naval Observatory backup
    - "time-a.nist.gov"     # NIST atomic clock
    - "time-b.nist.gov"     # NIST atomic clock backup

# Network settings
network:
  timeout_seconds: 5.0       # Socket timeout
  port: 123                  # Standard NTP port
  max_retries: 3             # Retry attempts per server
  retry_delay: 0.5           # Delay between retries (seconds)

# Synchronization settings  
sync:
  samples_per_server: 3      # Number of samples to take from each server
  max_servers_to_query: 5    # Maximum servers to query per sync
  auto_sync_interval: 3600   # Auto-sync interval (seconds) - 1 hour
  max_offset_threshold: 300  # Maximum acceptable offset (seconds)
  quality_threshold: 0.1     # Accuracy threshold for "good" sync (seconds)

# Quality assessment
quality:
  stratum_penalty: 0.001     # Penalty per stratum level (seconds)
  delay_factor: 0.5          # Factor for network delay impact
  dispersion_factor: 1.0     # Factor for root dispersion impact
  min_accuracy: 0.001        # Minimum accuracy claim (seconds)

# Monitoring integration
monitoring:
  enable_timestamp_correction: true    # Apply offset to monitoring timestamps
  log_sync_events: true               # Log synchronization events
  store_sync_history: true            # Keep history of sync results
  max_history_entries: 100            # Maximum sync history to retain
  
# Austrian Business Cycle Monitor integration
austrian_monitor:
  accurate_timestamps: true           # Use NetTime for all monitoring timestamps
  sync_before_analysis: true          # Sync time before running analysis
  include_time_quality: true          # Include time quality in reports
  timestamp_format: "iso"             # Timestamp format (iso, unix, custom)

# Alert settings
alerts:
  enable_sync_alerts: false           # Enable alerts for sync issues
  max_offset_alert: 1.0               # Alert if offset exceeds this (seconds)
  sync_failure_alert: true            # Alert on sync failures
  poor_quality_alert: 0.5             # Alert if accuracy worse than this

# Advanced settings
advanced:
  leap_second_handling: "system"      # How to handle leap seconds (system, ignore, manual)
  precision_mode: "high"              # Precision mode (high, normal, fast)
  server_selection: "best"            # Server selection (best, round_robin, random)
  ipv6_enabled: true                  # Enable IPv6 support
  local_clock_discipline: false       # Attempt to discipline local clock
