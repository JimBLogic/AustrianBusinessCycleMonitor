name: abcm-sites-local

services:
  monitor:
    build:
      context: .
      dockerfile: Dockerfile.local
    init: true
    restart: unless-stopped
    ports:
      - "${ABCM_LOCAL_PORT:-5173}:5173"
    environment:
      FRED_API_KEY: ${FRED_API_KEY:-}
    volumes:
      - abcm-d1:/app/.wrangler
      - abcm-runtime:/app/.sites-runtime
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  abcm-d1:
  abcm-runtime:
