[tool.black]
line-length = 120
target-version = ["py311"]
skip-string-normalization = true

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
  "data",
  "archives",
  "logs",
  "production_audit_backup_20251024",
  "docs/REPO_MANIFEST.md",
]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "F401", "F403", "F405"]
fixable = ["E", "F"]
per-file-ignores = {"tests/*" = ["F401"]}
