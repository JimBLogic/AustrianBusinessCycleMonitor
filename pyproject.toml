[tool.black]
line-length = 120
target-version = ["py38", "py39", "py310", "py311"]
skip-string-normalization = true

[tool.ruff]
line-length = 120
target-version = "py38"
exclude = ["data", "archives", "logs", "docs/REPO_MANIFEST.md"]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "F401", "F403", "F405"]
fixable = ["E", "F"]
per-file-ignores = {"tests/*" = ["F401"]}
