name: Isolated ABCM dependency security review (no deployment)

on:
  push:
    branches:
      - audit/security-patches-20261015
    paths:
      - security/**
      - .github/workflows/abcm-security-review.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abcm-security-review-20261015
  cancel-in-progress: true

jobs:
  npm-lockfile-audit:
    name: Current and historical npm lockfile advisories
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Inventory lockfile advisories without installing or rewriting
        run: node security/lockfile-audit.mjs
      - name: Upload read-only security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abcm-lockfile-audit-20261015
          path: security-evidence/lockfile-advisories-20261015.json
          if-no-files-found: warn
          retention-days: 14

  python-requirements-audit:
    name: Historical Python backend requirements review
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install isolated pinned pip-audit utility
        run: python -m pip install --disable-pip-version-check --no-input 'pip-audit==2.10.1'
      - name: Audit unpinned legacy Python requirements (informational)
        run: |
          mkdir -p security-evidence
          python -m pip_audit -r requirements.txt --format json --output security-evidence/python-requirements-20261015.json --progress-spinner off
      - name: Preserve Python audit result even when vulnerabilities are found
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abcm-python-audit-20261015
          path: security-evidence/python-requirements-20261015.json
          if-no-files-found: warn
          retention-days: 14
