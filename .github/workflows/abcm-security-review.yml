name: Isolated ABCM dependency security review (no deployment)

on:
  push:
    branches:
      - audit/security-patches-20261015
    paths:
      - security/**
      - .github/workflows/abcm-security-review.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abcm-security-review-20261015
  cancel-in-progress: true

jobs:
  npm-lockfile-audit:
    name: Current and historical npm lockfile advisories
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test source-level security regression gates
        run: node --test security/*.test.mjs
      - name: Inventory lockfile advisories without installing or rewriting
        run: node security/lockfile-audit.mjs
      - name: Block any current Site or QA advisory, keep archival findings visible
        run: node security/verify-current-audit.mjs
      - name: Upload read-only security evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: abcm-lockfile-audit-20261015
          path: security-evidence/lockfile-advisories-20261015.json
          if-no-files-found: warn
          retention-days: 14

  python-requirements-audit:
    name: Historical Python backend requirements review
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install isolated pinned pip-audit utility
        run: python -m pip install --disable-pip-version-check --no-input 'pip-audit==2.10.1'
      - name: Audit unpinned legacy Python requirements (informational)
        run: |
          mkdir -p security-evidence
          python -m pip_audit -r requirements.txt --format json --output security-evidence/python-requirements-20261015.json --progress-spinner off
      - name: Preserve Python audit result even when vulnerabilities are found
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: abcm-python-audit-20261015
          path: security-evidence/python-requirements-20261015.json
          if-no-files-found: warn
          retention-days: 14

  maintained-site-node24-smoke:
    name: Maintained Site Node 24 compatibility (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sites-current
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install current Sites exact locked dependencies
        run: npm ci --no-audit
      - name: Fail on any known maintained Site advisories
        run: npm audit --package-lock-only --audit-level=low
      - name: Verify bounded upstream braces mitigation and application behavior
        run: |
          npm run lint
          npm run typecheck
          npm test
