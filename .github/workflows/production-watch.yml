name: Hourly production integrity watch
on:
  pull_request:
    branches: [master]
    paths: ['automation/production-watch.mjs', 'automation/production-health-report.mjs', 'automation/production-health-report.test.mjs', '.github/workflows/production-watch.yml', 'sites-current/app/version.ts']
  push:
    branches: [master]
    paths: ['automation/production-watch.mjs', 'automation/production-health-report.mjs', 'automation/production-health-report.test.mjs', '.github/workflows/production-watch.yml', 'sites-current/app/version.ts']
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: abcm-production-watch
  cancel-in-progress: false
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14'
      - name: Check deterministic monitoring regressions
        run: node --test automation/production-health-report.test.mjs
      - name: Verify real values, coverage, health, edition age and persistence
        run: node automation/production-watch.mjs
