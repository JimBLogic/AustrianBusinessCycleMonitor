name: Austrian Business Cycle Monitor CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - '3.8'
          - '3.9'
          - '3.10'
          - '3.11'
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        run: |
          pytest -q || pytest -q -vv

      - name: Import smoke
        run: |
          python -c "from apps.core.austrian_monitor import AustrianCycleMonitor; print('Core imports OK')"
          python -c "from apps.dashboard.webapp import AustrianDashboard; print('Dashboard imports OK')"

      - name: Build Docker image
        if: matrix.python-version == '3.11'
        run: |
          docker build -t abcm-ci:latest .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v3
        with:
          python-version: '3.11'
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff black
      - name: Ruff Lint
        run: ruff check .
      - name: Black Format Check
        run: black --check .
