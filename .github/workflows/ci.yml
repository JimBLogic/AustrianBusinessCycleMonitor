# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Austrian Business Cycle Monitor CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.10', '3.11' ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f dev-requirements.txt ]; then pip install -r dev-requirements.txt; fi

      - name: Run pytest
        run: pytest -q || pytest -q -vv

      - name: Import smoke
        run: |
          python -c "from apps.core.austrian_monitor import AustrianCycleMonitor; print('Core imports OK')"
          python -c "from apps.dashboard.webapp import AustrianDashboard; print('Dashboard imports OK')"

      # Optional frontend build (runs only on 3.11). Includes Node setup and npm cache.
      - name: Set up Node.js
        if: ${{ matrix.python-version == '3.11' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm
        if: ${{ matrix.python-version == '3.11' }}
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('packages/frontend/package-lock.json', 'packages/frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Build frontend (if present)
        if: ${{ matrix.python-version == '3.11' }}
        run: |
          if [ -f packages/frontend/package.json ]; then \
            cd packages/frontend && \
            ( [ -f package-lock.json ] && npm ci || npm install ) && \
            npm run build; \
          else \
            echo "packages/frontend/package.json not found, skipping frontend build"; \
          fi

      - name: Upload frontend build artifact
        if: ${{ matrix.python-version == '3.11' && hashFiles('packages/frontend/dist/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: packages/frontend/dist
          if-no-files-found: ignore
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff black
      - name: Ruff Lint
        run: ruff check .
      - name: Black Format Check
        run: black --check .

  docker-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t abcm-ci:latest .
      - name: Run container smoke test (mock backend)
        run: |
          docker rm -f abcm-ci || true
          docker run -d --name abcm-ci -p 5002:5002 \
            -e BACKEND_MODE=mock \
            abcm-ci:latest
          sleep 5
          curl -fsS http://127.0.0.1:5002/api/status | jq . || (docker logs abcm-ci && exit 1)
          docker rm -f abcm-ci

  publish-image:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master') }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  windows-integration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\npm-cache
          key: ${{ runner.os }}-npm-${{ hashFiles('packages/frontend/package-lock.json', 'packages/frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      
      - name: Run test_all.ps1
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\test_all.ps1
        env:
          BACKEND_MODE: mock
