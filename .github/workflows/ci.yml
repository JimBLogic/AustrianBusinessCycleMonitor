# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Austrian Business Cycle Monitor CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Python 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f dev-requirements.txt ]; then pip install -r dev-requirements.txt; fi

      - name: Compile Python sources
        run: python -m compileall -q apps tests

      - name: Run tests
        run: pytest -q

      - name: Import smoke
        run: |
          python -c "from apps.core.austrian_monitor import AustrianCycleMonitor; print('Core imports OK')"
          python -c "from apps.dashboard.webapp import AustrianDashboard; print('Dashboard imports OK')"

  frontend:
    name: Frontend · React/Vite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: packages/frontend/package-lock.json

      - name: Install dependencies
        working-directory: packages/frontend
        run: npm ci

      - name: Type-check
        working-directory: packages/frontend
        run: npm run type-check

      - name: Run tests
        working-directory: packages/frontend
        run: npm run test -- --run --passWithNoTests

      - name: Build
        working-directory: packages/frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: packages/frontend/dist
          if-no-files-found: error
          retention-days: 7

  backend-quality:
    name: Backend quality report
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install quality tools
        run: python -m pip install ruff black

      - name: Ruff
        run: ruff check apps tests

      - name: Black
        if: always()
        run: black --check apps tests

  frontend-quality:
    name: Frontend lint report
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: packages/frontend/package-lock.json

      - name: Install dependencies
        working-directory: packages/frontend
        run: npm ci

      - name: Lint
        working-directory: packages/frontend
        run: npm run lint

  docker-smoke:
    name: Docker smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t abcm-ci:latest .

      - name: Run container smoke test
        run: |
          docker rm -f abcm-ci || true
          docker run -d --name abcm-ci -p 5002:5002 \
            -e BACKEND_MODE=mock \
            abcm-ci:latest
          trap 'docker logs abcm-ci || true; docker rm -f abcm-ci || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:5002/api/status | jq .; then
              exit 0
            fi
            sleep 2
          done
          echo 'Container did not become healthy in time.' >&2
          exit 1

  publish-image:
    name: Publish container image
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker-smoke]
    if: ${{ github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master') }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
