# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Austrian Business Cycle Monitor CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Python 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f dev-requirements.txt ]; then pip install -r dev-requirements.txt; fi

      - name: Compile Python sources
        run: python -m compileall -q apps tests

      - name: Run tests
        run: pytest -q

      - name: Import production factory
        run: python -c "from apps.dashboard.factory import create_app; app = create_app(); print(app.url_map)"

  frontend:
    name: Frontend · React/Vite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: packages/frontend/package-lock.json

      - name: Install dependencies
        working-directory: packages/frontend
        run: npm ci

      - name: Type-check
        working-directory: packages/frontend
        run: |
          set -o pipefail
          npm run type-check 2>&1 | tee typecheck.log

      - name: Upload type-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-typecheck-report
          path: packages/frontend/typecheck.log
          if-no-files-found: warn
          retention-days: 7

      - name: Run tests
        working-directory: packages/frontend
        run: npm run test -- --run --passWithNoTests

      - name: Build
        working-directory: packages/frontend
        run: npm run build

      - name: Verify public bundle
        working-directory: packages/frontend
        run: |
          grep -R -q "Evidence-first economic monitoring" dist/assets
          if grep -R -q "In Satoshi We Trust" dist/assets; then
            echo "Legacy dashboard copy leaked into the production bundle."
            exit 1
          fi

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: packages/frontend/dist
          if-no-files-found: error
          retention-days: 7

  backend-quality:
    name: Backend quality report
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install quality tools
        run: python -m pip install ruff black
      - name: Ruff
        run: ruff check apps tests
      - name: Black
        if: always()
        run: black --check apps tests

  frontend-quality:
    name: Frontend lint report
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: packages/frontend/package-lock.json
      - name: Install dependencies
        working-directory: packages/frontend
        run: npm ci
      - name: Lint
        working-directory: packages/frontend
        run: npm run lint

  docker-smoke:
    name: Production Docker smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Validate production Compose configuration
        run: |
          cp .env.production.example .env.production
          docker compose --env-file .env.production -f compose.production.yml config > compose.resolved.yml
          grep -q "economy.example.com" compose.resolved.yml

      - name: Build Docker image
        run: |
          set -o pipefail
          docker build --progress=plain -t abcm-ci:latest . 2>&1 | tee docker-build.log

      - name: Upload Docker build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-report
          path: docker-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Run production container smoke test
        run: |
          docker rm -f abcm-ci || true
          docker run -d --name abcm-ci -p 5002:5002 \
            -e BACKEND_MODE=webapp \
            -e ECONOMIC_DATA_DB=/app/data/economic_data.sqlite3 \
            abcm-ci:latest
          trap 'docker logs abcm-ci || true; docker rm -f abcm-ci || true' EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:5002/api/health | jq -e '.ok == true'; then
              break
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:5002/ > index.html
          grep -q '<div id="root"></div>' index.html

          status_code=$(curl -sS -o trusted-error.json -w '%{http_code}' \
            http://127.0.0.1:5002/api/trusted-snapshots/latest)
          test "$status_code" = "503"
          jq -e '.error.code == "snapshot_store_unavailable"' trusted-error.json

  sites-selfhost-smoke:
    name: Exact Sites self-host smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          cache: npm
          cache-dependency-path: sites-current/package-lock.json

      - name: Install locked Sites dependencies
        working-directory: sites-current
        run: npm ci

      - name: Validate source and production Worker artifact
        working-directory: sites-current
        run: |
          npm run lint
          npm test
          npm audit --omit=dev --audit-level=high


      - name: Validate exact self-host Compose
        working-directory: sites-current
        run: |
          cp .env.selfhost.example .env.selfhost
          docker compose --env-file .env.selfhost -f compose.selfhost.yml config > compose.selfhost.resolved.yml
          grep -q "Dockerfile.selfhost" compose.selfhost.resolved.yml

      - name: Build and smoke exact self-host image
        working-directory: sites-current
        run: |
          docker build --progress=plain -f Dockerfile.selfhost -t abcm-sites-selfhost:ci .
          docker run -d --name abcm-sites-selfhost -p 8787:8787 abcm-sites-selfhost:ci
          trap 'docker logs abcm-sites-selfhost || true; docker rm -f abcm-sites-selfhost || true' EXIT

          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/api/health | jq -e '.release == 38'; then
              break
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:8787/ > selfhost-index.html
          curl -fsS http://127.0.0.1:8787/api/data-manifest | jq -e '.build.siteRelease == 38'
          grep -q "Austrian Business Cycle Monitor" selfhost-index.html
  publish-image:
    name: Publish container image
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker-smoke]
    if: ${{ github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master') }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
