name: Production data refresh and verification
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/production-data.yml'
      - 'sites-current/scripts/verify-production.mjs'
      - 'sites-current/scripts/production-daily.mjs'
      - 'sites-current/lib/production-verification.mjs'
      - 'sites-current/lib/timestamp.mjs'
      - 'automation/production-daily.mjs'
  schedule:
    - cron: '0 10,11 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: abcm-production-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate daily recovery policy
        run: node --test automation/production-daily.test.mjs
      - name: Verify production write policy
        run: node --test automation/production-write-policy.test.mjs
      - name: Refresh Madrid daily edition, including delayed scheduled runs
        if: github.ref == 'refs/heads/master' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: node automation/production-daily.mjs
