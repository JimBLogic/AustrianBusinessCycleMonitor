# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Run Live Smoke (Manual)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      fred_api_key:
        description: "Optional per-run FRED API key (leave blank to use repo secret)"
        required: false
        type: string

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve FRED API key
        env:
          INPUT_KEY: ${{ inputs.fred_api_key }}
          SECRET_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -n "$INPUT_KEY" ]; then
            echo "FRED_API_KEY=$INPUT_KEY" >> "$GITHUB_ENV"
            echo "✔ Using fred_api_key from manual input"
          elif [ -n "$SECRET_KEY" ]; then
            echo "FRED_API_KEY=$SECRET_KEY" >> "$GITHUB_ENV"
            echo "✔ Using repo secret FRED_API_KEY"
          else
            echo "✖ No FRED API key available (provide input or set repo secret FRED_API_KEY)" >&2
            exit 1
          fi
      - name: Build Docker image
        run: docker build -t abcm-live:latest .
      - name: Run container smoke test (live FRED)
        run: |
          if [ -z "$FRED_API_KEY" ]; then echo "FRED_API_KEY missing"; exit 1; fi
          docker rm -f abcm-live || true
          docker run -d --name abcm-live -p 5002:5002 \
            -e BACKEND_MODE=webapp \
            -e FRED_API_KEY="$FRED_API_KEY" \
            abcm-live:latest
          sleep 8
          curl -fsS http://127.0.0.1:5002/api/status | jq . || (docker logs abcm-live && exit 1)
          docker rm -f abcm-live
