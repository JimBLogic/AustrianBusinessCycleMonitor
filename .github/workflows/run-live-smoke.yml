# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Run Live Smoke (Manual)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate masked repository FRED secret without accepting typed workflow inputs
        shell: bash
        run: |
          if [[ -z "${FRED_API_KEY:-}" ]]; then
            echo "::error::FRED_API_KEY repository or environment secret is required; no manual plaintext input is permitted."
            exit 1
          fi
      - name: Build Docker image
        run: docker build -t abcm-live:latest .
      - name: Run container smoke test (live FRED)
        run: |
          if [ -z "$FRED_API_KEY" ]; then echo "FRED_API_KEY missing"; exit 1; fi
          docker rm -f abcm-live || true
          docker run -d --name abcm-live -p 5002:5002 \
            -e BACKEND_MODE=webapp \
            -e FRED_API_KEY \
            abcm-live:latest
          sleep 8
          curl -fsS http://127.0.0.1:5002/api/status | jq . || (docker logs abcm-live && exit 1)
          docker rm -f abcm-live
